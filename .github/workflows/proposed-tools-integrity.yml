name: Proposed offline tools integrity

on:
  pull_request:
    paths:
      - "proposals/offline_starter/**"
      - ".github/workflows/proposed-tools-integrity.yml"
  push:
    branches: [main, codex/offline-starter-20261002]
    paths:
      - "proposals/offline_starter/**"
      - ".github/workflows/proposed-tools-integrity.yml"

permissions:
  contents: read

concurrency:
  group: proposed-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-development-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install covariance dependency
        run: python -m pip install numpy
      - name: Test proposed offline tools with fictional fixtures
        working-directory: proposals/offline_starter
        run: python -m unittest discover -v
